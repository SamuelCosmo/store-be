server:
  port: ${PORT:8080}

spring:
  application:
    name: store-platform
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:storedb}
    username: ${PGUSER:store}
    password: ${PGPASSWORD:store}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  cors:
    # Orígenes permitidos separados por coma — en prod el dominio del front.
    origins: ${CORS_ORIGINS:http://localhost:3000}
  jwt:
    # ponytail: dev default, override with JWT_SECRET in real environments
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  cookie:
    # Solo la usa POST /api/auth/logout para expirar cookies store_token
    # que una versión previa pudo dejar en browsers (auth es Bearer).
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAMESITE:Lax}
  storage:
    # Bucket local (adobe/s3mock en docker-compose). En producción apuntar
    # las env STORAGE_* al bucket real.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9090}
    access-key: ${STORAGE_ACCESS_KEY:store}
    secret-key: ${STORAGE_SECRET_KEY:storedev123}
    bucket: ${STORAGE_BUCKET:product-images}
    public-url: ${STORAGE_PUBLIC_URL:http://localhost:9090/product-images}
  logs:
    # días que se conservan en app_logs (pantalla de SUPERADMIN); purga diaria 04:15
    retention-days: ${LOG_RETENTION_DAYS:30}
  seed:
    # Datos de prueba (client_test). false en producción.
    dev-data: ${SEED_DEV_DATA:true}

logging:
  pattern:
    # contexto en cada línea (texto plano). En Railway definir
    # LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash → JSON con estos campos
    # como atributos filtrables (@requestId:..., @userId:...).
    correlation: "[req=%X{requestId:-} user=%X{userId:-} store=%X{storeId:-}] "
  level:
    # DEBUG muestra también los GET exitosos (polling de KDS/POS)
    com.store.platform.common.logging: ${LOG_LEVEL_REQUESTS:INFO}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
